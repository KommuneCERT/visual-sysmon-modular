name: Deploy to GitHub Pages
# GitHub Pages is deployed from the `next` branch (the branch under active development).
# `main` is the stable reference (tag v1.0-modular-ui) and does not deploy. To go back to
# deploying main, change the branch below on the branch that should be live.
on:
  push:
    branches: [next]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version-file: vendor/sysmon-modular/tooling/go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: tools/build.sh
      - run: node tests/wasm_smoke.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
