services:
  app:
    build: .
    image: visual-sysmon-modular:latest
    ports:
      - "8080:8080"
    volumes:
      # Profiles, overlay modules and builds. Named volume = no host permission issues.
      # To use a host directory instead, replace with "./data:/data" and set
      # "user: \"${UID}:${GID}\"" so the container can write to it.
      - vsm-data:/data
    environment:
      - APP_TITLE=Visual Sysmon Modular
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vsm-data:
