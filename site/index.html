<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Sysmon Modular</title>
  <meta name="description" content="Build Sysmon configurations from sysmon-modular in the browser: pick modules, edit rules, validate, merge and download.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 50'%3E%3Cpath d='M22 6L7 13v11c0 9.18 6.38 17.77 15 20 8.62-2.23 15-10.82 15-20V13L22 6z' fill='%231a5fa8'/%3E%3Cpath d='M14 25l5 5 11-11' stroke='%230a9dd9' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/kommunecert-theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/xmlhl.js"></script>
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body x-data>
<div id="boot-error" class="kc-callout kc-callout--danger m-4" hidden></div>

<template x-if="$store.app">
<div>
<nav class="kc-navbar d-flex align-items-center justify-content-between flex-wrap gap-2">
  <a class="kc-logo text-decoration-none" href="#/">
    <svg width="28" height="32" viewBox="0 0 44 50" fill="none" aria-hidden="true">
      <path d="M22 6L7 13v11c0 9.18 6.38 17.77 15 20 8.62-2.23 15-10.82 15-20V13L22 6z" fill="rgba(30,95,168,0.6)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
      <path d="M14 25l5 5 11-11" stroke="#0a9dd9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="kc-logo-name" x-text="$store.app.title"></div>
      <div class="kc-logo-sub">sysmon-modular · in your browser</div>
    </div>
  </a>
  <div class="d-flex gap-2 align-items-center flex-wrap">
    <div class="dropdown">
      <button class="btn btn-sm btn-outline-light dropdown-toggle vsm-profile-btn" data-bs-toggle="dropdown">Profile: <strong x-text="$store.app.profile?.name"></strong></button>
      <ul class="dropdown-menu dropdown-menu-end">
        <template x-for="p in $store.app.profiles" :key="p.slug">
          <li><a class="dropdown-item" :class="{ active: p.slug === $store.app.state.current }" href="#/" @click.prevent="$store.app.switchProfile(p.slug)"><span x-text="p.name"></span> <span class="text-muted small">· <span x-text="p.modules.length"></span> modules · v<span x-text="p.sysmon_version"></span></span></a></li>
        </template>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="#/profile">+ New profile / settings</a></li>
      </ul>
    </div>
    <a href="#/" class="kc-nav-link" :class="{ active: $store.app.route.page === 'search' }" title="Search the current configuration">Search</a>
    <a href="#/profile" class="kc-nav-link" :class="{ active: $store.app.route.page === 'profile' }" title="Profile settings, bulk selection, import/export">Profile</a>
    <a href="#/builds" class="kc-nav-link" :class="{ active: ['builds','build'].includes($store.app.route.page) }">Builds</a>
    <a href="#/coverage" class="kc-nav-link" :class="{ active: $store.app.route.page === 'coverage' }" title="ATT&amp;CK coverage of the selected modules">Coverage</a>
    <a href="#/help" class="kc-nav-link" :class="{ active: $store.app.route.page === 'help' }" title="How the tool and Sysmon filtering work">Help</a>
    <div class="dropdown">
      <button class="btn btn-sm btn-outline-light dropdown-toggle vsm-profile-btn" data-bs-toggle="dropdown" title="Your profiles and edited modules live only in this browser – save them to a file">💾 Save / Load</button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><h6 class="dropdown-header">Profiles and edited modules live only in this browser</h6></li>
        <li><a class="dropdown-item" href="#" @click.prevent="$store.app.exportAll()">⬇ Export everything (JSON)</a></li>
        <li><a class="dropdown-item" href="#" @click.prevent="$store.app.importMode = 'replace'; $refs.importFile.click()">⬆ Import – replace what is here</a></li>
        <li><a class="dropdown-item" href="#" @click.prevent="$store.app.importMode = 'merge'; $refs.importFile.click()">⬆ Import – merge into what is here</a></li>
        <input type="file" accept=".json" class="d-none" x-ref="importFile" @change="$store.app.importFromInput($event)">
      </ul>
    </div>
    <span class="kc-tag kc-tag-blue" x-text="`Sysmon ${$store.app.profile?.sysmon_version} · schema ${$store.app.schemaFor[$store.app.profile?.sysmon_version]}`"></span>
    <button class="btn btn-sm btn-info fw-bold text-white px-3" @click="$store.app.runBuild()" :disabled="!!$store.app.busy" title="Merge the selected modules into sysmonconfig.xml">▶ Build</button>
  </div>
</nav>

<div class="vsm-shell">
  <aside class="vsm-sidebar kc-surface" id="sidebar">
    <div class="vsm-sidebar-head">
      <span class="kc-section-tag">Categories</span>
      <span class="kc-tag" x-text="`${$store.app.selected.size} / ${$store.app.moduleTotal} selected`"></span>
    </div>
    <div class="list-group list-group-flush vsm-catlist">
      <template x-for="row in $store.app.sidebar" :key="row.cat.dirname">
        <a :href="'#/c/' + row.cat.dirname" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" :class="{ active: row.cat.dirname === $store.app.route.cat }">
          <span class="d-flex align-items-center gap-2 text-truncate"><span class="vsm-evid" x-text="row.cat.event_ids.join('/')"></span><span class="text-truncate" x-text="row.cat.label"></span><template x-for="t in $store.app.costTags(row.cat.dirname, { max: 1 })" :key="t.key"><span :class="t.cls" x-pop="'<strong>' + ({volume:'High event volume',cpu:'High CPU cost per event',disk:'Uses disk on the host',privacy:'Captures sensitive data'})[t.key] + '.</strong> ' + $store.app.costOf(row.cat.dirname).why" @click.stop.prevent x-text="t.label"></span></template></span>
          <span class="badge rounded-pill" :class="row.selected === 0 ? 'vsm-badge-none' : row.selected === row.total ? 'vsm-badge-all' : 'vsm-badge-some'" x-text="row.selected + '/' + row.total"></span>
        </a>
      </template>
    </div>
  </aside>

  <main class="vsm-main">
    <div class="kc-callout kc-callout--success mb-3 vsm-flash" x-show="$store.app.flash" x-cloak><span class="kc-callout-icon">✓</span><div><p class="kc-callout-body mb-0" x-text="$store.app.flash"></p></div></div>
    <div class="kc-callout kc-callout--danger mb-3" x-show="$store.app.engine.state === 'error'" x-cloak><span class="kc-callout-icon">✖</span><div><div class="kc-callout-title">Engine failed to load</div><p class="kc-callout-body mb-0" x-text="$store.app.engine.error"></p></div></div>

    <!-- ═══════════ SEARCH (landing) ═══════════ -->
    <template x-if="$store.app.route.page === 'search'">
      <div x-data="pageSearch">
        <div class="vsm-search-hero kc-surface rounded-3 p-4 mb-3">
          <div class="vsm-search-form">
            <div class="vsm-search-row">
              <input id="q" class="form-control form-control-lg vsm-search-input" type="search" autofocus autocomplete="off" x-model.debounce.150ms="q"
                     placeholder="Search the configuration – e.g. lsass, T1003, powershell -enc, DestinationPort 4444, adobe …">
            </div>
            <div class="vsm-search-filters">
              <div class="btn-group btn-group-sm" role="group" title="Which modules to search">
                <input type="radio" class="btn-check" id="scope-sel" value="selected" x-model="scope"><label class="btn btn-outline-secondary" for="scope-sel" x-text="`selected (${$store.app.selected.size})`"></label>
                <input type="radio" class="btn-check" id="scope-all" value="all" x-model="scope"><label class="btn btn-outline-secondary" for="scope-all" x-text="`all (${$store.app.moduleTotal})`"></label>
              </div>
              <span class="text-muted small ms-auto">Tip: <code>-word</code> · <code>/regex/</code> · <code>kind:</code> · <code>cat:</code> · <code>field:</code> · <code>tech:</code> … <a href="#/help/search">Syntax</a> <button x-help="'Words are AND-ed and matched case-insensitively. Each hit is one <code>&lt;Rule&gt;</code> or bare condition with its context (module → RuleGroup → event). Examples: <code>field:CommandLine -enc</code>, <code>tech:T1003 kind:include</code>, <code>cat:22 -google</code>, <code>event:ProcessAccess op:&quot;contains any&quot;</code>. Press <kbd>/</kbd> anywhere to jump here.'"></button></span>
            </div>
          </div>
        </div>

        <template x-if="result === null">
          <div class="text-muted small px-1">Type to search <span x-text="$store.app.selected.size"></span> selected modules – or pick a filter to browse.
            <span class="ms-2">Try: <a href="#" @click.prevent="q='lsass'">lsass</a> · <a href="#" @click.prevent="q='T1059'">T1059</a> · <a href="#" @click.prevent="q='onmatch=exclude'">exclude</a> · <a href="#" @click.prevent="q='DestinationPort'">DestinationPort</a></span>
            <div class="kc-callout mt-4"><span class="kc-callout-icon">💡</span><div><div class="kc-callout-title">Pick modules → edit rules → Build → download sysmonconfig.xml <button class="btn btn-sm btn-primary ms-2" @click="$dispatch('open-wizard')">Start here – guided setup</button></div><p class="kc-callout-body mb-0">Each category in the sidebar is a Sysmon event ID with upstream's include (detection) and exclude (noise) modules. Switch them on or off for this profile, tune a rule where needed, then press <strong>Build</strong> – the merge runs in your browser. Nothing leaves your machine; your profiles and edited modules are stored in this browser only, so use <strong>Save / Load</strong> to keep them. The <a href="#/help">Help</a> page explains the tool and how Sysmon's include/exclude filtering works.</p></div></div>
          </div>
        </template>
        <template x-if="result !== null">
          <div>
            <div class="d-flex align-items-center gap-2 flex-wrap mb-2 px-1">
              <span class="kc-tag kc-tag-blue" x-text="result.total + ' hits'"></span>
              <span class="kc-tag" x-text="result.modules_hit + ' of ' + result.modules_scanned + ' modules'"></span>
              <span class="kc-tag kc-tag-amber" x-show="result.truncated" x-text="'showing first ' + result.hits.length + ' – refine the search'"></span>
              <span class="ms-auto btn-group btn-group-sm" x-show="result.module_rels.length"><button class="btn btn-outline-primary" @click="bulk(true)" :title="'Switch on every module with a hit (' + result.module_rels.length + ')'">Select all hit modules</button><button class="btn btn-outline-danger" @click="bulk(false)" title="Switch off every module with a hit">Deselect</button></span>
            </div>
            <p class="text-muted px-1" x-show="!result.hits.length">No matches.</p>
            <template x-for="(hit, i) in result.hits" :key="i + hit.rel + hit.xml">
              <div>
                <div class="vsm-hit-module" x-show="newModule(i)">
                  <span class="kc-severity" :class="hit.kind === 'exclude' ? 'kc-severity-medium' : 'kc-severity-info'" x-text="hit.kind"></span>
                  <a :href="'#/m/' + hit.rel + '/edit'" class="vsm-hit-path"><code x-text="hit.rel"></code></a>
                  <span class="kc-tag kc-tag-green" x-show="hit.source === 'edited'">edited</span><span class="kc-tag kc-tag-navy" x-show="hit.source === 'custom'">custom</span>
                  <span class="kc-tag kc-tag-red" x-show="!hit.selected" title="Not selected in this profile – not part of the build">not selected</span>
                  <a class="btn btn-sm btn-outline-secondary ms-auto py-0" :href="'#/m/' + hit.rel + '/raw'">XML</a>
                </div>
                <div class="vsm-hit" :class="{ 'vsm-hit--cont': !newCtx(i) }">
                  <div class="vsm-hit-ctx text-muted" x-show="hit.block === 'module'">whole module – matched on path / group names
                    <template x-for="t in hit.techniques" :key="t[0]"><a class="kc-tag kc-tag-blue ms-2" :href="'https://attack.mitre.org/techniques/' + t[0].replace('.', '/') + '/'" target="_blank" rel="noopener" :title="t[1]" x-text="t[0]"></a></template></div>
                  <div class="vsm-hit-ctx" x-show="hit.block !== 'module' && newCtx(i)">
                    <span class="x-t">&lt;RuleGroup</span> <span class="x-a">name</span>=<span class="x-s" x-text="'&quot;' + hit.group_name + '&quot;'"></span> <span class="x-a">groupRelation</span>=<span class="x-s" x-text="'&quot;' + hit.group_relation + '&quot;'"></span><span class="x-t">&gt;</span>
                    <span class="vsm-hit-sep">›</span>
                    <span class="x-t" x-text="'<' + hit.event_type"></span> <span class="x-a">onmatch</span>=<span class="x-s" x-text="'&quot;' + hit.onmatch + '&quot;'"></span><span class="x-t">&gt;</span>
                  </div>
                  <div class="vsm-sentence" x-show="hit.block !== 'module'" x-text="sentence(hit)"></div>
                  <div class="vsm-hit-tech" x-show="hit.block !== 'module' && hit.techniques.length"><template x-for="t in hit.techniques" :key="t[0]"><span><a class="kc-tag kc-tag-blue" :href="'https://attack.mitre.org/techniques/' + t[0].replace('.', '/') + '/'" target="_blank" rel="noopener" x-text="t[0]"></a> <span class="text-muted small" x-text="t[1]"></span></span></template></div>
                  <pre class="vsm-xml-view" :class="hit.block === 'module' ? 'vsm-hit-module-xml' : 'vsm-xml-view--auto vsm-hit-xml'" :data-mark="mark" x-xml="hit.xml"></pre>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- ═══════════ PROFILE ═══════════ -->
    <template x-if="$store.app.route.page === 'profile'">
      <div x-data="pageProfile">
        <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
          <div>
            <span class="kc-section-tag">Profile <button x-help="'A profile is one selection of modules plus its build settings. Use one per fleet, e.g. <code>servers</code> and <code>workstations</code>. Profiles are independent, but edited/custom modules (the overlay) are shared by all of them.'"></button></span>
            <h1 class="kc-section-title mb-0" x-text="$store.app.profile.name"></h1>
            <div class="text-muted small" x-text="summary"></div>
          </div>
          <div class="d-flex gap-2"><button class="btn btn-sm btn-primary" @click="$store.app.runBuild()">▶ Build now</button></div>
        </div>
        <p class="small text-muted mb-3">Profiles and edited modules live in this browser only – <a href="#" @click.prevent="$store.app.exportAll()">export a JSON file</a> to keep or move them (navbar → Save / Load).</p>

        <div class="row g-4">
          <div class="col-lg-7">
            <div class="kc-surface p-3 rounded-3 mb-4"><h2 class="kc-section-title">Before you deploy <button x-help="'Plain-language checks on the current selection and the last build: empty or exclude-only selections, high-volume event types without their noise exclusions, target-version pitfalls, analyzer hints and whether the profile changed since the last build.'"></button></h2><div x-include="'tpl-checklist'"></div></div>

            <div class="kc-surface p-4 rounded-3 mb-4">
              <h2 class="kc-section-title">Build settings</h2>
              <form class="row g-3" @submit.prevent="save()">
                <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" x-model="form.name" required></div>
                <div class="col-md-6"><label class="form-label">Target Sysmon version <button x-help="'The Sysmon binary the output will be loaded on. Sets <code>schemaversion</code> and decides which events and fields are allowed. Run <code>sysmon64</code> on a host to see its version.'"></button></label>
                  <select class="form-select" x-model="form.sysmon_version"><template x-for="t in $store.app.sysmonTargets" :key="t.v"><option :value="t.v" x-text="`${t.label} → schema ${t.schema}`"></option></template></select></div>
                <div class="col-12"><label class="form-label">Description</label><input class="form-control" x-model="form.description"></div>
                <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="unsup" x-model="form.strip_unsupported"><label class="form-check-label" for="unsup">Remove events and fields the target version does not support (recommended) <button x-help="'Off: unsupported items stay in the output and are only reported as warnings – the file may fail to load on the older binary. On: they are stripped so the file loads cleanly; an event filter that becomes empty is removed entirely. Irrelevant when targeting the newest Sysmon.'"></button></label></div></div>
                <div class="col-12"><button class="btn btn-primary">Save settings</button></div>
              </form>
            </div>

            <details class="kc-surface p-4 rounded-3 mb-4 vsm-details">
              <summary class="kc-section-title mb-0">Advanced: bulk selection &amp; module lists</summary>
              <div class="mt-3">
                <div class="d-flex flex-wrap gap-2 mb-3">
                  <button class="btn btn-outline-primary btn-sm" @click="$store.app.selectAll('all')">Select all modules</button>
                  <button class="btn btn-outline-primary btn-sm" @click="$store.app.selectAll('include')">Include modules only</button>
                  <button class="btn btn-outline-primary btn-sm" @click="$store.app.selectAll('exclude')">Exclude modules only</button>
                  <button class="btn btn-outline-danger btn-sm" @click="confirm('Deselect every module in this profile?') && $store.app.selectAll('none')">Deselect all</button>
                  <button class="btn btn-outline-secondary btn-sm ms-auto" @click="$store.app.exportList()" title="Export this profile as an upstream-style include list">⬇ include_rules.txt</button>
                </div>
                <h3 class="h6">Import an include/exclude list (upstream text format) <button x-help="'Plain text, one entry per line: a module path (<code>1_process_creation/include_foo.xml</code>) or a directory (selects every module in it). Lines starting with <code>#</code> are ignored. Same format as <code>0_custom_configuration/example_include_rules.txt</code> upstream.'"></button></h3>
                <div class="row g-2 align-items-end">
                  <div class="col-md-7"><input class="form-control form-control-sm" type="file" accept=".txt" @change="importFile($event)"></div>
                  <div class="col-md-5"><select class="form-select form-select-sm" x-model="importMode"><option value="replace">Replace selection (include list)</option><option value="add">Add to selection</option><option value="exclude">Remove from selection (exclude list)</option></select></div>
                </div>
                <p class="small text-muted mt-3 mb-0">Tip: the search page's <code>kind:</code>/<code>cat:</code> syntax with <em>Select all hit modules</em> is often quicker than these.</p>
              </div>
            </details>
          </div>

          <div class="col-lg-5">
            <div class="kc-surface p-4 rounded-3 mb-4">
              <h2 class="kc-section-title">Recent builds</h2>
              <template x-if="builds.length"><div class="table-responsive"><table class="table table-sm kc-table mb-0"><thead><tr><th>Time</th><th>Status</th><th>Findings</th></tr></thead><tbody>
                <template x-for="b in builds" :key="b.id"><tr><td><a :href="'#/build/' + b.id" x-text="b.id.replace('T', ' ')"></a></td><td><span class="kc-severity" :class="b.ok ? 'kc-severity-low' : 'kc-severity-high'" x-text="b.ok ? 'OK' : 'FAILED'"></span></td><td class="small" x-text="b.summary.error + ' errors · ' + b.summary.warning + ' warnings'"></td></tr></template>
              </tbody></table></div></template>
              <p class="text-muted mb-0" x-show="!builds.length">No builds yet. Press <strong>Build</strong>.</p>
            </div>

            <div class="kc-surface p-4 rounded-3 mb-4" id="new-profile">
              <div class="d-flex justify-content-between align-items-start"><h2 class="kc-section-title">New profile <button x-help="'Presets mirror upstream\'s published configurations. Copying from a profile duplicates its module selection and settings. Start empty when you want to build a minimal, allow-listed configuration from scratch.'"></button></h2><button class="btn btn-sm btn-outline-primary" @click="$dispatch('open-wizard')">Guided start</button></div>
              <form class="row g-2" @submit.prevent="create()">
                <div class="col-12"><input class="form-control" x-model="newName" placeholder="e.g. workstations-prod" required></div>
                <div class="col-12"><select class="form-select" x-model="newMode" x-effect="$nextTick(() => $el.value = newMode)"><template x-for="p in $store.app.presets" :key="p.id"><option :value="'preset:' + p.id" x-text="p.name + ' (' + p.modules.length + ' modules)'"></option></template><option value="all">All modules</option><option value="none">Start empty</option></select>
                  <div class="form-text" x-text="($store.app.presets.find(p => 'preset:' + p.id === newMode) || {}).description || ''"></div></div>
                <div class="col-12"><select class="form-select" x-model="copyFrom"><option value="">— or copy from profile —</option><template x-for="p in $store.app.profiles" :key="p.slug"><option :value="p.slug" x-text="p.name"></option></template></select></div>
                <div class="col-12"><button class="btn btn-primary">Create profile</button></div>
              </form>
              <template x-if="$store.app.profiles.length > 1"><div><hr><button class="btn btn-sm btn-outline-danger" @click="confirm(`Delete the profile ${$store.app.profile.name}? Overlay modules are kept.`) && ($store.app.deleteProfile($store.app.state.current), init())" x-text="`Delete profile \u201c${$store.app.profile.name}\u201d`"></button></div></template>
            </div>

            <div class="kc-surface p-4 rounded-3" x-show="$store.app.overlayRels.length">
              <h2 class="kc-section-title">Custom / edited modules</h2>
              <ul class="list-unstyled mb-0 vsm-overlay-list"><template x-for="f in $store.app.overlayRels" :key="f"><li><a :href="'#/m/' + f + '/edit'"><code x-text="f"></code></a></li></template></ul>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══════════ CATEGORY ═══════════ -->
    <template x-if="$store.app.route.page === 'category'">
      <div x-data="pageCategory">
        <template x-if="!cat"><p class="text-muted">Category not found.</p></template>
        <template x-if="cat">
          <div>
            <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
              <div>
                <span class="kc-section-tag">Event ID <span x-text="cat.event_ids.join(' / ')"></span> <button x-help="'Every module here filters this Sysmon event. <span class=\'kc-severity kc-severity-info\'>include</span> modules are detections – only matching events are logged. <span class=\'kc-severity kc-severity-medium\'>exclude</span> modules suppress known noise. <strong>Exclude always wins</strong> when both match, so keep exclusions narrow.'"></button></span>
                <h1 class="kc-section-title mb-0" x-text="cat.label"></h1>
                <div class="text-muted small"><code x-text="cat.dirname + '/'"></code> · <span class="vsm-cost" x-pop="'<strong>Cost of enabling this event type – regardless of which modules you pick.</strong> ' + cost(cat.dirname).why"><template x-for="d in ['volume','cpu','disk','privacy']" :key="d"><span class="vsm-cost-dim" x-show="cost(cat.dirname)[d]" :class="'vsm-cost-' + (cost(cat.dirname)[d] || 'low')"><span x-text="d"></span> <b x-text="cost(cat.dirname)[d]"></b></span></template></span> · <span x-text="cat.modules.filter(m => m.kind === 'include').length"></span> include · <span x-text="cat.modules.filter(m => m.kind === 'exclude').length"></span> exclude</div>
              </div>
              <div class="d-flex gap-2 flex-wrap">
                <div class="dropdown">
                  <button class="btn btn-sm btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">Select</button>
                  <ul class="dropdown-menu">
                    <li><button class="dropdown-item" @click="$store.app.selectCategory(cat.dirname, 'all')">All modules in this category</button></li>
                    <li><button class="dropdown-item" @click="$store.app.selectCategory(cat.dirname, 'include')">Add all include modules</button></li>
                    <li><button class="dropdown-item" @click="$store.app.selectCategory(cat.dirname, 'exclude')">Add all exclude modules</button></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button class="dropdown-item text-danger" @click="$store.app.selectCategory(cat.dirname, 'none')">Deselect all in this category</button></li>
                  </ul>
                </div>
                <a class="btn btn-sm btn-primary" :href="'#/new/' + cat.dirname" title="Create a custom module in this category (stored in the overlay, not upstream)">+ New module</a>
              </div>
            </div>
            <div class="kc-callout kc-callout--warning mb-3" x-show="$store.app.costTags(cat.dirname).length"><span class="kc-callout-icon" x-text="cost(cat.dirname).privacy === 'high' ? '🔒' : cost(cat.dirname).disk === 'high' ? '💽' : cost(cat.dirname).cpu === 'high' ? '🔥' : '📈'"></span><div><div class="kc-callout-title">What enabling this event type costs on every host</div><p class="kc-callout-body mb-0" x-text="cost(cat.dirname).why"></p><p class="kc-callout-body mb-0 mt-1" x-show="cost(cat.dirname).disk !== 'low'">The archive directory is set by <code>ArchiveDirectory</code> in the template (default <code>Sysmon</code> → <code>C:\Sysmon</code>).</p><p class="kc-callout-body mb-0 mt-1">Selecting only <em>exclude</em> modules has no effect unless an include module is on; an empty include filter keeps the event off.</p></div></div>
            <div class="d-flex gap-2 mb-3 vsm-filter">
              <input class="form-control form-control-sm" x-model="q" placeholder="Search file name, title or technique (e.g. T1059)…">
              <select class="form-select form-select-sm w-auto" x-model="kind"><option value="">include + exclude</option><option value="include">include only</option><option value="exclude">exclude only</option></select>
            </div>
            <div class="vsm-cards">
              <template x-for="m in modules" :key="m.rel + m.source">
                <div class="kc-finding-card kc-finding-card--compact vsm-card" :class="[m.kind === 'exclude' ? 'kc-finding-card--warning' : 'kc-finding-card--accent', isOn(m.rel) ? '' : 'vsm-card-off']">
                  <div class="d-flex justify-content-between align-items-start gap-3">
                    <div class="flex-grow-1 min-w-0">
                      <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                        <span class="kc-severity" :class="m.kind === 'exclude' ? 'kc-severity-medium' : 'kc-severity-info'" :title="m.kind === 'exclude' ? 'Exclude module: suppresses matching events (noise reduction). Exclude wins over include.' : 'Include module: only matching events of this type are logged (detection).'" x-text="m.kind"></span>
                        <span class="kc-tag kc-tag-green" x-show="m.source === 'edited'" title="Upstream module shadowed by your overlay copy">edited</span>
                        <span class="kc-tag kc-tag-navy" x-show="m.source === 'custom'" title="Your own module – exists only in the overlay">custom</span>
                        <span class="kc-tag kc-tag-red" x-show="m.error" :title="m.error">invalid XML</span>
                        <code class="vsm-filename" x-text="m.filename"></code>
                      </div>
                      <div class="vsm-card-title" x-text="m.title"></div>
                      <div class="vsm-sentence" x-data="{ d: explain(m) }" x-effect="d = explain(m)">
                        <template x-for="(sen, i) in d.sentences" :key="i"><div x-text="sen"></div></template>
                        <a href="#" class="small" x-show="d.more" @click.prevent="expanded[m.rel] = true" x-text="'+ ' + d.more + ' more'"></a>
                        <a href="#" class="small" x-show="!d.more && d.total > 1 && expanded[m.rel]" @click.prevent="expanded[m.rel] = false">show less</a>
                      </div>
                      <div class="d-flex flex-wrap gap-1 mt-1" x-show="m.techniques.length">
                        <template x-for="t in m.techniques.slice(0, 4)" :key="t[0]"><span class="kc-tag kc-tag-blue" :title="t[1]" x-text="t[0]"></span></template>
                        <span class="kc-tag" x-show="m.techniques.length > 4" x-text="'+' + (m.techniques.length - 4)"></span>
                      </div>
                    </div>
                    <div class="d-flex flex-column align-items-end gap-2">
                      <div class="form-check form-switch m-0"><input class="form-check-input vsm-switch" type="checkbox" role="switch" :checked="isOn(m.rel)" @change="$store.app.toggle(m.rel, $event.target.checked)" title="Include in build"></div>
                      <div class="btn-group btn-group-sm">
                        <a class="btn btn-outline-primary" :href="'#/m/' + m.rel + '/edit'" title="Open the rule editor">Edit</a>
                        <a class="btn btn-outline-secondary" :href="'#/m/' + m.rel + '/raw'" title="Edit the raw XML">XML</a>
                        <button class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown"></button>
                        <ul class="dropdown-menu dropdown-menu-end">
                          <li><form class="px-3 py-2 d-flex gap-1" @submit.prevent="duplicate(m.rel)"><input class="form-control form-control-sm" x-model="dupName[m.rel]" placeholder="New name…" required><button class="btn btn-sm btn-primary">Duplicate</button></form></li>
                          <template x-if="m.source !== 'upstream'"><li><hr class="dropdown-divider"><button class="dropdown-item text-danger" @click="revert(m)" x-text="m.source === 'custom' ? 'Delete module' : 'Reset to upstream'"></button></li></template>
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
              <p class="text-muted" x-show="!modules.length">No modules match.</p>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ═══════════ NEW MODULE ═══════════ -->
    <template x-if="$store.app.route.page === 'newModule'">
      <div x-data="pageNewModule">
        <span class="kc-section-tag" x-text="cat?.label"></span>
        <h1 class="kc-section-title">New module</h1>
        <div class="kc-surface p-4 rounded-3 vsm-narrow">
          <form class="row g-3" @submit.prevent="create()">
            <div class="col-12"><label class="form-label">Name (becomes the file name)</label><input class="form-control" x-model="name" placeholder="e.g. Our EDR exclusions" required>
              <div class="form-text">Saved as <code x-text="$store.app.route.cat + '/' + kind + '_<name>.xml'"></code> in the overlay – upstream is never touched.</div></div>
            <div class="col-md-6"><label class="form-label">Type <button x-help="'<strong>include</strong>: a detection – only events matching your rules are logged. <strong>exclude</strong>: noise suppression – matching events are dropped, and exclude wins over any include. The type becomes the file name prefix and the <code>onmatch</code> of the first event block.'"></button></label>
              <select class="form-select" x-model="kind"><option value="include">include – log when the rule matches</option><option value="exclude">exclude – suppress when the rule matches</option></select></div>
            <div class="col-md-6"><label class="form-label">Event type <button x-help="'The Sysmon event this module filters. It determines which fields are available in the rule editor. Usually the event of the category you are in; you can add more event blocks in the editor afterwards.'"></button></label>
              <select class="form-select" x-model="eventType"><template x-for="et in Object.keys($store.app.fields.events)" :key="et"><option :value="et" x-text="et + ' (' + $store.app.fields.events[et].event_id + ')'"></option></template></select></div>
            <div class="col-12 d-flex gap-2"><button class="btn btn-primary">Create and edit</button><a class="btn btn-outline-secondary" :href="'#/c/' + $store.app.route.cat">Cancel</a></div>
          </form>
        </div>
      </div>
    </template>

    <!-- ═══════════ RULE EDITOR ═══════════ -->
    <template x-if="$store.app.route.page === 'editor'">
      <div x-data="pageEditor">
        <template x-if="error"><p class="text-muted" x-text="error"></p></template>
        <template x-if="model">
          <div>
            <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
              <div>
                <span class="kc-section-tag"><a :href="'#/c/' + m.category" x-text="m.category"></a> · rule editor</span>
                <h1 class="kc-section-title mb-0"><code x-text="m.filename"></code> <span class="kc-tag align-middle" :class="{ 'kc-tag-green': m.source === 'edited', 'kc-tag-navy': m.source === 'custom' }" x-text="m.source" x-pop="'<strong>' + m.source + '</strong> – ' + (m.source === 'upstream' ? 'unchanged upstream module; saving stores your copy in the overlay and upstream is never touched.' : m.source === 'edited' ? 'your overlay copy shadows the upstream module in every build.' : 'your own module; exists only in the overlay.') + ' The rule editor drops XML comments – use the raw XML editor to keep them.'"></span></h1>
              </div>
              <div class="d-flex gap-2 align-items-center">
                <span class="kc-tag kc-tag-amber" x-show="dirty">unsaved changes</span>
                <div class="btn-group btn-group-sm"><a class="btn btn-outline-secondary" :href="'#/m/' + m.rel + '/raw'">Raw XML</a><a class="btn btn-outline-secondary" :href="'#/c/' + m.category">Back</a></div>
                <button class="btn btn-sm btn-primary px-3" @click="save(false)" :disabled="saving">Save</button>
              </div>
            </div>
            <div class="d-flex gap-3 align-items-center flex-wrap mb-3">
              <label class="form-check form-switch small mb-0"><input class="form-check-input" type="checkbox" :checked="explain" @change="toggleExplain()"> <span class="form-check-label">Explain rules in plain words</span></label>
              <button class="btn btn-sm btn-outline-primary ms-auto" @click="addGroup()">+ RuleGroup</button>
            </div>
            <template x-for="(rg, gi) in model.rulegroups" :key="gi">
              <section class="kc-surface rounded-3 mb-4 vsm-group">
                <header class="vsm-group-head d-flex gap-2 align-items-center flex-wrap">
                  <span class="kc-tag kc-tag-navy">RuleGroup <button x-help="'Top-level container. <code>or</code> (default): the group matches if any rule or condition inside matches. <code>and</code>: all bare conditions must match. The name is informational; sysmon-modular puts the ATT&amp;CK tag here when the whole group covers one technique.'"></button></span>
                  <div class="vsm-pick flex-grow-1" x-data="techPicker({ get: () => rg.name, set: v => { rg.name = v; dirty = true } })" @click.outside="open = false">
                    <input class="form-control form-control-sm" placeholder="Name – type an ATT&amp;CK ID or name for suggestions (e.g. T1059 or powershell)" x-model="rg.name" @input="dirty=true; query($event.target.value)" @keydown="key($event)" @focus="query($event.target.value)">
                    <span class="kc-tag vsm-pick-status" x-show="status(rg.name)" :class="status(rg.name)?.cls" :title="status(rg.name)?.title" x-text="status(rg.name)?.text"></span>
                    <div class="vsm-pick-list" x-show="open" x-cloak><template x-for="(t, i) in items" :key="t.id"><button type="button" class="vsm-pick-item" :class="{ active: i === sel }" @mousedown.prevent="choose(t)"><code x-text="t.id"></code> <span x-text="t.full || t.name"></span><span class="text-muted small ms-1" x-text="t.tactics.join(', ')"></span></button></template></div>
                  </div>
                  <select class="form-select form-select-sm w-auto" x-model="rg.group_relation" @change="dirty=true"><option value="or">or</option><option value="and">and</option></select>
                  <button class="btn btn-sm btn-outline-primary" @click="addEvent(rg)">+ Event</button>
                  <button class="btn btn-sm btn-outline-danger" @click="if (confirm('Remove the entire RuleGroup?')) { model.rulegroups.splice(gi, 1); dirty = true }">✕</button>
                </header>
                <template x-for="(ev, ei) in rg.events" :key="ei">
                  <div class="vsm-event">
                    <div class="d-flex gap-2 align-items-center flex-wrap mb-2">
                      <select class="form-select form-select-sm w-auto fw-bold" x-model="ev.event_type" x-effect="$nextTick(() => $el.value = ev.event_type)" @change="dirty=true"><template x-for="et in eventTypes" :key="et"><option :value="et" x-text="et + ' (' + schema.events[et].event_id + ')'"></option></template></select>
                      <select class="form-select form-select-sm w-auto" x-model="ev.onmatch" @change="dirty=true"><option value="include">onmatch=include</option><option value="exclude">onmatch=exclude</option></select><button x-help="'<strong>include</strong>: only events matching a rule are logged. <strong>exclude</strong>: matching events are dropped. If an event matches both an include and an exclude rule anywhere in the configuration, <strong>exclude wins</strong>.'"></button>
                      <div class="ms-auto d-flex gap-1">
                        <button class="btn btn-sm btn-outline-primary" @click="ev.rules.push(newRule()); dirty=true">+ Rule</button>
                        <button class="btn btn-sm btn-outline-secondary" @click="ev.conditions.push(newCond(ev)); dirty=true">+ bare condition</button>
                        <button class="btn btn-sm btn-outline-danger" @click="if (confirm('Remove this event block?')) { rg.events.splice(ei, 1); dirty = true }">✕</button>
                      </div>
                    </div>
                    <template x-if="ev.conditions.length">
                      <div class="vsm-rule vsm-rule--bare">
                        <div class="vsm-sentence mb-1" x-show="explain" x-text="explainBare(rg, ev)"></div>
                        <div class="small text-muted mb-1">Bare conditions (directly under the event – each matched on its own) <button x-help="'Conditions without a Rule wrapper. Sysmon combines them with the RuleGroup\'s groupRelation (<code>or</code>: any matches). With no groupRelation, same-field conditions are OR-ed and different fields AND-ed.'"></button></div>
                        <template x-for="(c, ci) in ev.conditions" :key="ci">
                          <div class="vsm-cond">
                            <select class="form-select form-select-sm" x-model="c.field" x-effect="$nextTick(() => $el.value = c.field)" @change="dirty=true"><template x-for="f in fieldsFor(ev)" :key="f"><option :value="f" x-text="f"></option></template></select>
                            <select class="form-select form-select-sm" x-model="c.condition" x-effect="$nextTick(() => $el.value = c.condition)" @change="dirty=true"><template x-for="op in schema.conditions" :key="op"><option :value="op" x-text="op"></option></template></select>
                            <input class="form-control form-control-sm font-monospace" x-model="c.value" @input="dirty=true" :placeholder="isMulti(c) ? 'value1;value2' : 'value'">
                            <input class="form-control form-control-sm" x-model="c.name" @input="dirty=true" placeholder="name (optional)">
                            <button class="btn btn-sm btn-outline-danger" @click="ev.conditions.splice(ci, 1); dirty=true">✕</button>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-for="(r, ri) in ev.rules" :key="ri">
                      <div class="vsm-rule">
                        <div class="d-flex gap-2 align-items-center flex-wrap mb-1">
                          <span class="kc-tag">Rule <template x-if="ri === 0"><button x-help="'Groups conditions into one match. <code>and</code>: every condition must be true (e.g. Image <em>and</em> CommandLine). <code>or</code>: any one. The name is written to the event\'s <code>RuleName</code> field – keep the <code>technique_id=…,technique_name=…</code> format so coverage reports work.'"></button></template></span>
                          <div class="vsm-pick flex-grow-1" x-data="techPicker({ get: () => r.name, set: v => { r.name = v; dirty = true } })" @click.outside="open = false">
                            <input class="form-control form-control-sm" x-model="r.name" @input="dirty=true; query($event.target.value)" @keydown="key($event)" @focus="query($event.target.value)" placeholder="technique_id=T1234,technique_name=… – type an ID or name for suggestions">
                            <span class="kc-tag vsm-pick-status" x-show="status(r.name)" :class="status(r.name)?.cls" :title="status(r.name)?.title" x-text="status(r.name)?.text"></span>
                            <div class="vsm-pick-list" x-show="open" x-cloak><template x-for="(t, i) in items" :key="t.id"><button type="button" class="vsm-pick-item" :class="{ active: i === sel }" @mousedown.prevent="choose(t)"><code x-text="t.id"></code> <span x-text="t.full || t.name"></span><span class="text-muted small ms-1" x-text="t.tactics.join(', ')"></span></button></template></div>
                          </div>
                          <select class="form-select form-select-sm w-auto" x-model="r.group_relation" @change="dirty=true"><option value="and">and</option><option value="or">or</option></select>
                          <button class="btn btn-sm btn-outline-secondary" @click="r.conditions.push(newCond(ev)); dirty=true">+ condition</button>
                          <button class="btn btn-sm btn-outline-secondary" @click="ev.rules.splice(ri + 1, 0, JSON.parse(JSON.stringify(r))); dirty=true" title="Duplicate rule">⧉</button>
                          <button class="btn btn-sm btn-outline-danger" @click="ev.rules.splice(ri, 1); dirty=true">✕</button>
                        </div>
                        <template x-for="(c, ci) in r.conditions" :key="ci">
                          <div class="vsm-cond">
                            <select class="form-select form-select-sm" x-model="c.field" x-effect="$nextTick(() => $el.value = c.field)" @change="dirty=true"><template x-for="f in fieldsFor(ev)" :key="f"><option :value="f" x-text="f"></option></template></select>
                            <select class="form-select form-select-sm" x-model="c.condition" x-effect="$nextTick(() => $el.value = c.condition)" @change="dirty=true"><template x-for="op in schema.conditions" :key="op"><option :value="op" x-text="op"></option></template></select>
                            <input class="form-control form-control-sm font-monospace" x-model="c.value" @input="dirty=true" :placeholder="isMulti(c) ? 'value1;value2' : 'value'">
                            <input class="form-control form-control-sm" x-model="c.name" @input="dirty=true" placeholder="name (optional)">
                            <button class="btn btn-sm btn-outline-danger" @click="r.conditions.splice(ci, 1); dirty=true">✕</button>
                          </div>
                        </template>
                        <div class="vsm-sentence" x-show="explain && r.conditions.length" x-text="explainRule(ev, r)"></div>
                        <div class="text-muted small" x-show="!r.conditions.length">No conditions – this rule matches nothing. Add at least one.</div>
                      </div>
                    </template>
                  </div>
                </template>
                <div class="text-muted small p-3" x-show="!rg.events.length">No events in this RuleGroup.</div>
              </section>
            </template>
            <div class="d-flex gap-2 align-items-center mb-3">
              <button class="btn btn-primary px-3" @click="save(false)" :disabled="saving">Save</button>
              <button class="btn btn-outline-warning" x-show="hasErrors" @click="save(true)">Save anyway (ignore errors)</button>
              <span class="text-muted small" x-show="saving">Validating with sysmon-modular…</span>
              <span class="text-success small" x-show="status" x-text="status"></span>
            </div>
            <div class="mb-4" x-html="findingsHtml()"></div>
            <details class="mb-4" x-show="xmlPreview"><summary class="small text-muted">Show generated XML</summary><pre class="vsm-xml-view mt-2" x-xml="xmlPreview"></pre></details>
          </div>
        </template>
      </div>
    </template>

    <!-- ═══════════ RAW XML ═══════════ -->
    <template x-if="$store.app.route.page === 'raw'">
      <div x-data="pageRaw">
        <template x-if="!m"><p class="text-muted">Module not found.</p></template>
        <template x-if="m">
          <div>
            <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
              <div>
                <span class="kc-section-tag"><a :href="'#/c/' + m.category" x-text="m.category"></a> · raw XML</span>
                <h1 class="kc-section-title mb-0"><code x-text="m.filename"></code></h1>
                <div class="small text-muted">Source: <span x-text="m.source"></span><span x-show="m.source === 'upstream'"> – saved as an overlay copy on first change</span></div>
              </div>
              <div class="btn-group btn-group-sm"><a class="btn btn-outline-primary" :href="'#/m/' + m.rel + '/edit'">Rule editor</a><a class="btn btn-outline-secondary" :href="'#/c/' + m.category">Back</a></div>
            </div>
            <div class="kc-callout kc-callout--danger" x-show="parseError"><span class="kc-callout-icon">✖</span><div><div class="kc-callout-title">XML cannot be parsed</div><p class="kc-callout-body mb-0" x-text="parseError"></p></div></div>
            <textarea class="vsm-xml-editor" spellcheck="false" autocomplete="off" x-model="xml"></textarea>
            <div class="d-flex gap-2 mt-3 align-items-center flex-wrap">
              <button class="btn btn-primary" @click="save()" :disabled="busy">Save</button>
              <button class="btn btn-outline-secondary" @click="validate()" :disabled="busy">Validate</button>
              <label class="form-check ms-2" x-show="findings && findings.some(f => f.severity === 'error')"><input class="form-check-input" type="checkbox" x-model="force"> <span class="form-check-label">Save anyway (ignore errors)</span> <button x-help="'Writes the module even if validation reports errors. The build will still validate it, so use this only for work in progress. Malformed XML that cannot be parsed at all is never merged.'"></button></label>
            </div>
            <div class="mt-2 small" :class="msg.startsWith('Saved') ? 'text-success' : 'text-danger'" x-text="msg"></div>
            <div class="mt-3" x-html="findingsHtml()"></div>
          </div>
        </template>
      </div>
    </template>

    <!-- ═══════════ BUILDS LIST ═══════════ -->
    <template x-if="$store.app.route.page === 'builds'">
      <div>
        <div class="d-flex justify-content-between align-items-end mb-3">
          <div><span class="kc-section-tag">Profile <span x-text="$store.app.profile.name"></span></span><h1 class="kc-section-title mb-0">Build history</h1></div>
          <button class="btn btn-sm btn-primary" @click="$store.app.runBuild()">▶ Build now</button>
        </div>
        <p class="text-muted" x-show="!$store.app.buildsFor($store.app.state.current).length">No builds yet.</p>
        <div class="kc-surface rounded-3 p-3" x-show="$store.app.buildsFor($store.app.state.current).length">
          <div class="table-responsive"><table class="table kc-table mb-0">
            <thead><tr><th>Build</th><th>Status</th><th>Sysmon</th><th>Modules</th><th>Errors</th><th>Warn.</th><th>Perf.</th><th>Recom.</th><th>Size</th></tr></thead>
            <tbody><template x-for="b in $store.app.buildsFor($store.app.state.current)" :key="b.id">
              <tr><td><a :href="'#/build/' + b.id" x-text="b.id.replace('T', ' ')"></a></td>
                <td><span class="kc-severity" :class="b.ok ? 'kc-severity-low' : 'kc-severity-high'" x-text="b.ok ? 'OK' : 'FAILED'"></span></td>
                <td x-text="b.sysmon_version + ' / ' + b.schemaversion"></td><td x-text="b.module_count"></td>
                <td x-text="b.summary.error"></td><td x-text="b.summary.warning"></td><td x-text="b.summary.performance"></td><td x-text="b.summary.recommendation"></td>
                <td x-text="(b.output_size / 1024).toFixed(1) + ' KB'"></td></tr>
            </template></tbody></table></div>
          <p class="small text-muted mb-0 mt-2">The last 10 builds per profile are kept in this browser.</p>
        </div>
      </div>
    </template>

    <!-- ═══════════ BUILD RESULT ═══════════ -->
    <template x-if="$store.app.route.page === 'build'">
      <div x-data="pageBuild">
        <template x-if="!b"><p class="text-muted">Build not found.</p></template>
        <template x-if="b">
          <div>
            <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
              <div>
                <span class="kc-section-tag"><a href="#/builds">Builds</a> · <span x-text="b.profile_name"></span></span>
                <h1 class="kc-section-title mb-0">Build <span x-text="b.id.replace('T', ' ')"></span> <span class="kc-severity align-middle" :class="b.ok ? 'kc-severity-low' : 'kc-severity-high'" x-text="b.ok ? 'OK' : 'FAILED'"></span></h1>
                <div class="text-muted small" x-text="`Sysmon ${b.sysmon_version} · schema ${b.schemaversion} · ${b.module_count} modules → ${b.group_count} RuleGroups · ${(b.output_size / 1024).toFixed(1)} KB · upstream ${b.upstream}`"></div>
              </div>
              <div class="d-flex gap-2">
                <button class="btn btn-primary" x-show="b.ok" @click="download()">⬇ Download sysmonconfig.xml</button>
                <button class="btn btn-outline-primary" @click="$store.app.runBuild()">▶ Build again</button>
              </div>
            </div>
            <div class="kc-callout kc-callout--danger mb-3" x-show="b.error"><span class="kc-callout-icon">✖</span><div><p class="kc-callout-body mb-0" x-text="b.error"></p></div></div>
            <div class="d-flex gap-2 flex-wrap mb-3">
              <span class="kc-severity kc-severity-high" x-text="b.summary.error + ' errors'"></span>
              <span class="kc-severity kc-severity-medium" x-text="b.summary.warning + ' warnings'"></span>
              <span class="kc-severity kc-severity-low" x-text="b.summary.performance + ' performance'"></span>
              <span class="kc-severity kc-severity-info" x-text="b.summary.recommendation + ' recommendations'"></span>
            </div>
            <details class="mb-3" :open="$store.app.checklist.some(i => i.level !== 'info')"><summary class="fw-bold">Before you deploy <span class="kc-tag" x-text="$store.app.checklist.length + ' notes'"></span></summary><div class="mt-2" x-include="'tpl-checklist'"></div></details>
            <ul class="nav nav-tabs mb-3">
              <li class="nav-item" x-show="b.ok"><button class="nav-link" :class="{ active: tab === 'deploy' }" @click="tab = 'deploy'">Deploy</button></li>
              <li class="nav-item"><button class="nav-link" :class="{ active: tab === 'findings' }" @click="tab = 'findings'" x-text="'Findings (' + b.findings.length + ')'"></button></li>
              <li class="nav-item align-self-center"><button x-help="'<strong>Errors</strong> fail the build (invalid XML, unknown fields, bad ATT&amp;CK metadata). <strong>Warnings</strong> mean the file works but something is off – typically events/fields the target Sysmon version does not support. <strong>Performance</strong> and <strong>recommendations</strong> come from the analyzer and are advisory. <strong>Coverage</strong> counts conditions and ATT&amp;CK techniques per event; <strong>Diff</strong> compares rule meaning with an earlier build, ignoring formatting.'"></button></li>
              <li class="nav-item" x-show="matrix"><button class="nav-link" :class="{ active: tab === 'coverage' }" @click="tab = 'coverage'">Coverage</button></li>
              <li class="nav-item"><button class="nav-link" :class="{ active: tab === 'diff' }" @click="tab = 'diff'">Diff</button></li>
              <li class="nav-item" x-show="b.ok"><button class="nav-link" :class="{ active: tab === 'xml' }" @click="tab = 'xml'; loadXml()">XML</button></li>
            </ul>
            <div x-show="tab === 'deploy'">
              <div class="row g-4">
                <div class="col-lg-7">
                  <ol class="vsm-deploy">
                    <li><strong>Download</strong> the file above and save it as <code x-text="fileName()"></code> next to <code>sysmon64.exe</code> on a pilot host. Keep the file – it is what you will roll back to.</li>
                    <li><strong>Install</strong> (first time on a host):
                      <div class="vsm-cmd"><code x-text="'sysmon64.exe -accepteula -i ' + fileName()"></code><button class="btn btn-sm btn-outline-secondary" x-copy="'sysmon64.exe -accepteula -i ' + fileName()">Copy</button></div></li>
                    <li><strong>Update</strong> an existing installation (no reboot, no reinstall):
                      <div class="vsm-cmd"><code x-text="'sysmon64.exe -c ' + fileName()"></code><button class="btn btn-sm btn-outline-secondary" x-copy="'sysmon64.exe -c ' + fileName()">Copy</button></div></li>
                    <li><strong>Verify</strong> – dump the active configuration and check the schema version and rule counts:
                      <div class="vsm-cmd"><code>sysmon64.exe -c</code><button class="btn btn-sm btn-outline-secondary" x-copy="'sysmon64.exe -c'">Copy</button></div>
                      Events appear in <code>Applications and Services Logs → Microsoft → Windows → Sysmon → Operational</code>; event 16 confirms the configuration change.</li>
                    <li><strong>Watch volume for a day</strong> on the pilot group, then roll out. Add exclusions for your own noisy software as custom exclude modules and build again.</li>
                    <li><strong>Roll back</strong> by applying the previous file (<span x-show="previous"><a :href="'#/build/' + (previous?.id || '')" x-text="previous ? 'build ' + previous.id.replace('T', ' ') : ''"></a></span><span x-show="!previous">any earlier build</span>) with <code>-c</code>, or reset to Sysmon's defaults:
                      <div class="vsm-cmd"><code>sysmon64.exe -c --</code><button class="btn btn-sm btn-outline-secondary" x-copy="'sysmon64.exe -c --'">Copy</button></div></li>
                  </ol>
                </div>
                <div class="col-lg-5">
                  <div class="kc-callout mb-3"><span class="kc-callout-icon">🎯</span><div><div class="kc-callout-title">Target: Sysmon <span x-text="b.sysmon_version"></span> (schema <span x-text="b.schemaversion"></span>)</div><p class="kc-callout-body mb-0">The hosts must run this Sysmon major version or newer. An older binary rejects the file with a schema error – rebuild with a lower target on the Profile page instead.</p></div></div>
                  <div class="kc-callout mb-3"><span class="kc-callout-icon">🏢</span><div><div class="kc-callout-title">Fleet rollout</div><p class="kc-callout-body mb-0">Distribute <code>sysmon64.exe</code> and the XML with your management tool and run the update command: a GPO startup script or scheduled task, Intune Win32 app / Proactive Remediation, or SCCM package. Point the script at a UNC or local path and run it as SYSTEM. Sysmon re-reads the configuration; a reboot is not needed.</p></div></div>
                  <div class="kc-callout"><span class="kc-callout-icon">💾</span><div><div class="kc-callout-title">Keep this build</div><p class="kc-callout-body mb-0">Builds live only in this browser. Store the downloaded XML (and a JSON export from <em>Save / Load</em>) in your own repository so you can reproduce or roll back later. For upstream's CLI or CI pipelines, the selection is also available as an <a href="#" @click.prevent="$store.app.exportList()">include_rules.txt</a>.</p></div></div>
                </div>
              </div>
            </div>
            <div x-show="tab === 'findings'">
              <div class="kc-callout kc-callout--success" x-show="!b.findings.length"><span class="kc-callout-icon">✓</span><div><p class="kc-callout-body mb-0">No findings. The configuration validates cleanly.</p></div></div>
              <template x-for="sev in ['error','warning','performance','recommendation','info']" :key="sev">
                <details class="mb-3" x-show="grouped[sev].length" :open="sev === 'error' || sev === 'warning'"><summary class="fw-bold" x-text="sevLabel(sev) + ' (' + grouped[sev].length + ')'"></summary><div class="mt-2" x-html="findingsHtml(grouped[sev])"></div></details>
              </template>
            </div>
            <div x-show="tab === 'coverage'"><template x-if="matrix"><div>
              <div class="row g-3 mb-3">
                <div class="col-6 col-md-3"><div class="kc-stat-card kc-stat-card--primary"><span class="kc-stat-num" x-text="matrix.include"></span><span class="kc-stat-label">include conditions</span></div></div>
                <div class="col-6 col-md-3"><div class="kc-stat-card kc-stat-card--warning"><span class="kc-stat-num" x-text="matrix.exclude"></span><span class="kc-stat-label">exclude conditions</span></div></div>
                <div class="col-6 col-md-3"><div class="kc-stat-card kc-stat-card--accent"><span class="kc-stat-num" x-text="matrix.technique_total"></span><span class="kc-stat-label">ATT&amp;CK techniques</span></div></div>
                <div class="col-6 col-md-3"><div class="kc-stat-card"><span class="kc-stat-num" x-text="matrix.events.length"></span><span class="kc-stat-label">Event types</span></div></div>
              </div>
              <div x-data="attackMatrix" x-include="'tpl-matrix'"></div>
            </div></template></div>
            <div x-show="tab === 'diff'">
              <div class="d-flex gap-2 align-items-center mb-3">
                <label class="small text-muted">Compare with build:</label>
                <select class="form-select form-select-sm w-auto" x-model="diffBefore"><template x-for="o in others" :key="o.id"><option :value="o.id" x-text="o.id.replace('T', ' ')"></option></template></select>
                <button class="btn btn-sm btn-outline-primary" :disabled="!others.length" @click="runDiff()">Show diff</button>
              </div>
              <div x-html="diffHtml"></div>
              <p class="text-muted" x-show="!others.length && !diffHtml">No earlier successful build to compare with.</p>
            </div>
            <div x-show="tab === 'xml'"><pre class="vsm-xml-view vsm-xml-view--auto" x-xml="xml || ''"></pre></div>
          </div>
        </template>
      </div>
    </template>

    <!-- ═══════════ COVERAGE (live) ═══════════ -->
    <template x-if="$store.app.route.page === 'coverage'">
      <div x-data="pageCoverage">
        <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
          <div>
            <span class="kc-section-tag">Profile <span x-text="$store.app.profile.name"></span> · current selection</span>
            <h1 class="kc-section-title mb-0">ATT&amp;CK coverage <button x-help="'Computed live from the <strong>currently selected</strong> modules (no build needed). Only rules that carry <code>technique_id=…</code> metadata count – a technique is covered when at least one selected include rule is tagged with it. This is telemetry coverage (Sysmon will log matching activity), not detection quality.'"></button></h1>
            <div class="text-muted small"><span x-text="$store.app.selected.size"></span> modules selected · techniques and tactics from the ATT&amp;CK table embedded in upstream's tooling</div>
          </div>
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">⬇ Export</button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><button class="dropdown-item" @click="navigator('19')">ATT&amp;CK Navigator layer (v19)</button></li>
              <li><button class="dropdown-item" @click="navigator('18')">Navigator layer remapped to v18 <span class="text-muted small">– for the hosted Navigator</span></button></li>
              <li><button class="dropdown-item" @click="json()">Coverage JSON</button></li>
            </ul>
          </div>
        </div>
        <p class="text-muted" x-show="loading">Computing coverage…</p>
        <div class="kc-callout kc-callout--warning" x-show="error"><span class="kc-callout-icon">⚠</span><div><p class="kc-callout-body mb-0" x-text="error"></p></div></div>
        <template x-if="matrix">
          <div>
            <section class="row g-3 mb-3">
              <div class="col-6 col-xl-3"><div class="kc-stat-card kc-stat-card--primary"><span class="kc-stat-num" x-text="matrix.technique_total"></span><span class="kc-stat-label">Techniques <button x-help="'Distinct technique IDs (parents and sub-techniques) referenced by at least one selected rule.'"></button></span></div></div>
              <div class="col-6 col-xl-3"><div class="kc-stat-card kc-stat-card--accent"><span class="kc-stat-num" x-text="matrix.tactic_total"></span><span class="kc-stat-label">Tactics</span></div></div>
              <div class="col-6 col-xl-3"><div class="kc-stat-card" :class="tagging.pct < 60 ? 'kc-stat-card--warning' : 'kc-stat-card--primary'"><span class="kc-stat-num" x-text="tagging.pct + '%'"></span><span class="kc-stat-label">Rules tagged <button x-help="'Share of selected <em>include</em> rules that carry ATT&amp;CK metadata (a tag on the RuleGroup counts for all rules inside it). Untagged rules still log events – they just do not show up in coverage.'"></button></span></div></div>
              <div class="col-6 col-xl-3"><div class="kc-stat-card" :class="tagging.untagged ? 'kc-stat-card--warning' : ''"><span class="kc-stat-num" x-text="tagging.untagged"></span><span class="kc-stat-label">Untagged rules</span></div></div>
            </section>
            <div class="kc-surface rounded-3 p-3 mb-4"><div x-data="attackMatrix" x-include="'tpl-matrix'"></div></div>
            <div class="row g-4">
              <div class="col-lg-6"><div class="kc-surface rounded-3 p-3"><h2 class="kc-section-title">Per Sysmon event</h2>
                <div class="table-responsive"><table class="table table-sm kc-table mb-0"><thead><tr><th>Event</th><th>include</th><th>exclude</th><th>modules</th></tr></thead><tbody><template x-for="e in matrix.events" :key="e.name"><tr><td x-text="e.name"></td><td x-text="e.include"></td><td x-text="e.exclude"></td><td x-text="e.modules.length"></td></tr></template></tbody></table></div></div></div>
              <div class="col-lg-6"><div class="kc-surface rounded-3 p-3"><h2 class="kc-section-title">Include modules with untagged rules <button x-help="'These selected modules contain include rules without <code>technique_id</code> metadata. Add a tag in the rule editor (Rule name or RuleGroup name) to make them count.'"></button></h2>
                <ul class="list-unstyled mb-0 vsm-overlay-list vsm-scroll" x-show="tagging.untagged_modules.length"><template x-for="[rel, n] in tagging.untagged_modules" :key="rel"><li><a :href="'#/m/' + rel + '/edit'"><code x-text="rel"></code></a> <span class="kc-tag" x-text="n"></span></li></template></ul>
                <p class="text-muted mb-0" x-show="!tagging.untagged_modules.length">Every selected include rule is tagged.</p></div></div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ═══════════ HELP ═══════════ -->
    <template x-if="$store.app.route.page === 'help'">
      <div id="help-root" x-data="{ loaded: false }"
           x-init="fetch('help.html').then(r => r.text()).then(h => { $el.innerHTML = h; window.vsmXml.init($el); $store.app.fillCostTable($el.querySelector('#cost-table tbody')); loaded = true; $nextTick(() => $store.app.scrollToSection()) })"
           x-effect="$store.app.route.id; loaded && $nextTick(() => $store.app.scrollToSection())"></div>
    </template>
  </main>
</div>

<!-- Wizard: guided start (auto-opens on first visit, also via "Start here") -->
<div class="modal fade" id="wizard" tabindex="-1" x-data="wizard" x-init="if ($store.app.showWizard) $nextTick(() => open())" @open-wizard.window="step = 1; open()" @hidden.bs.modal="$store.app.dismissWizard()">
  <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content vsm-wizard">
    <div class="modal-header"><div><div class="kc-section-tag">Guided start · step <span x-text="step"></span> of 3</div><h2 class="kc-section-title mb-0" x-text="step === 1 ? 'Which configuration do you start from?' : step === 2 ? 'Which Sysmon version runs on those hosts?' : 'Name the profile'"></h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Skip"></button></div>
    <div class="modal-body">
      <template x-if="step === 1">
        <div>
          <p class="text-muted">These are sysmon-modular's own published configurations (their names, their module selections). Pick by the <em>use</em> line – every module can be changed afterwards.</p>
          <div class="row g-3">
            <template x-for="p in presets" :key="p.id">
              <div class="col-md-6"><button type="button" class="vsm-env" :class="{ active: presetId === p.id }" @click="pick(p.id)">
                <span class="vsm-env-icon" x-text="icons[p.id] || '📦'"></span><span class="vsm-env-title" x-text="p.name"></span>
                <span class="vsm-env-use"><strong>Use for:</strong> <span x-text="p.use"></span></span>
                <span class="vsm-env-text" x-text="p.description"></span>
                <span class="d-flex gap-1 mt-2"><span class="kc-tag" x-text="p.modules.length + ' modules'"></span><span class="kc-tag kc-tag-blue" x-text="p.tagline.split(' ')[0]"></span></span></button></div>
            </template>
          </div>
        </div>
      </template>
      <template x-if="step === 2">
        <div>
          <p class="text-muted">The version decides which events and fields the output may contain. Run <code>sysmon64</code> without arguments on a host – the first line prints the installed version.</p>
          <div class="d-flex gap-2 flex-wrap mb-3"><template x-for="t in $store.app.sysmonTargets" :key="t.v"><button type="button" class="btn" :class="version === t.v ? 'btn-primary' : 'btn-outline-primary'" @click="version = t.v" x-text="t.label + ' · schema ' + t.schema"></button></template></div>
          <div class="kc-callout"><span class="kc-callout-icon">💡</span><div><p class="kc-callout-body mb-0">Older targets: events such as FileExecutableDetected (15) or fields such as <code>User</code> on file events (14) are removed from the output so it loads cleanly – the build page lists what was dropped. Not installed yet? Choose 15.20 or newer and install the current Sysmon.</p></div></div>
        </div>
      </template>
      <template x-if="step === 3">
        <div>
          <label class="form-label">Profile name</label><input class="form-control form-control-lg" x-model="name" placeholder="e.g. workstations" @keydown.enter="finish()">
          <div class="kc-callout mt-3"><span class="kc-callout-icon">✓</span><div><div class="kc-callout-title" x-text="preset ? preset.name + ' · Sysmon ' + version : ''"></div><p class="kc-callout-body mb-0" x-text="preset ? preset.description : ''"></p></div></div>
        </div>
      </template>
    </div>
    <div class="modal-footer justify-content-between">
      <button type="button" class="btn btn-link text-muted" data-bs-dismiss="modal">Skip – I know what I'm doing</button>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary" x-show="step > 1" @click="step--">Back</button>
        <button type="button" class="btn btn-primary" x-show="step === 2" @click="step = 3">Next</button>
        <button type="button" class="btn btn-primary" x-show="step === 3" :disabled="!name.trim() || !preset" @click="finish()">Create profile</button>
      </div>
    </div>
  </div></div>
</div>

<!-- Shared "before you deploy" checklist -->
<template id="tpl-checklist">
  <div class="vsm-checklist">
    <template x-for="(i, n) in $store.app.checklist" :key="n">
      <div class="kc-callout kc-callout--compact" :class="i.level === 'error' ? 'kc-callout--danger' : i.level === 'warn' ? 'kc-callout--warning' : ''">
        <span class="kc-callout-icon" x-text="i.level === 'error' ? '✖' : i.level === 'warn' ? '⚠' : '💡'"></span>
        <div class="min-w-0"><div class="kc-callout-title"><span x-text="i.title"></span> <a class="small ms-1" x-show="i.href" :href="i.href">open →</a></div><div class="kc-callout-body small" x-text="i.detail"></div></div>
      </div>
    </template>
    <div class="kc-callout kc-callout--success kc-callout--compact" x-show="!$store.app.checklist.length"><span class="kc-callout-icon">✓</span><div><div class="kc-callout-title">Nothing to flag – the selection looks deployable.</div></div></div>
  </div>
</template>

<footer class="vsm-footer text-muted small">
  <span x-text="$store.app.title"></span> · runs entirely in your browser (upstream tooling compiled to WebAssembly) ·
  upstream <a :href="$store.app.upstream.commit_url" target="_blank" rel="noopener"><code x-text="$store.app.upstream.short"></code></a> (<span x-text="$store.app.upstream.date"></span>) ·
  <a href="https://github.com/olafhartong/sysmon-modular" target="_blank" rel="noopener">olafhartong/sysmon-modular</a>
</footer>

<div class="vsm-busy" x-show="$store.app.busy" x-cloak><div class="kc-surface rounded-3 p-4 d-flex align-items-center gap-3"><span class="spinner-border text-primary"></span><span x-text="$store.app.busy"></span></div></div>
</div>
</template>

<!-- Shared ATT&CK matrix markup. Expects `matrix` (attack.buildMatrix) from the enclosing component. -->
<template id="tpl-matrix">
  <div class="vsm-matrix-wrap">
    <div class="d-flex gap-2 align-items-center flex-wrap mb-2">
      <input class="form-control form-control-sm vsm-matrix-search" placeholder="Filter techniques (ID, name or module)…" x-model="q">
      <label class="form-check form-check-inline small mb-0"><input class="form-check-input" type="checkbox" x-model="showSubs"> <span class="form-check-label">Show sub-techniques</span></label>
      <span class="ms-auto d-flex align-items-center gap-1 small text-muted">Rules per technique: <span class="vsm-cell-swatch vsm-lvl-1"></span>1 <span class="vsm-cell-swatch vsm-lvl-2"></span>2–4 <span class="vsm-cell-swatch vsm-lvl-3"></span>5–9 <span class="vsm-cell-swatch vsm-lvl-4"></span>10+</span>
    </div>
    <div class="vsm-matrix">
      <template x-for="col in matrix.columns" :key="col.tactic">
        <div class="vsm-tactic">
          <div class="vsm-tactic-head"><div class="vsm-tactic-name" x-text="col.label"></div><div class="vsm-tactic-meta" x-text="col.technique_count + ' techniques · ' + col.hits + ' rules'"></div></div>
          <template x-for="t in col.techniques" :key="t.id">
            <div class="vsm-tech" :class="['vsm-lvl-' + t.level, t.direct ? '' : 'vsm-tech-parent-only', sel === t.id ? 'vsm-tech-active' : '']" x-show="matches(t)" @click="select(t.id)" :title="t.id + ' ' + t.name + ' · ' + t.total + ' rules in ' + t.module_count + ' modules'">
              <span class="vsm-tech-id" x-text="t.id"></span><span class="vsm-tech-name" x-text="t.name"></span><span class="vsm-tech-count" x-text="t.total"></span>
              <div class="vsm-subs" x-show="showSubs && t.subs.length">
                <template x-for="s in t.subs" :key="s.id">
                  <div class="vsm-sub" :class="{ 'vsm-tech-active': sel === s.id }" @click.stop="select(s.id)" :title="s.id + ' ' + s.name + ' · ' + s.count + ' rules'">
                    <span class="vsm-tech-id" x-text="'.' + s.id.split('.')[1]"></span> <span class="vsm-tech-name" x-text="s.name.split(':').pop().trim()"></span> <span class="vsm-tech-count" x-text="s.count"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
    <div class="vsm-tech-detail kc-surface rounded-3 p-3 mt-3" x-show="sel" x-cloak>
      <template x-if="current(matrix)">
        <div>
          <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
            <a :href="'https://attack.mitre.org/techniques/' + sel.replace('.', '/') + '/'" target="_blank" rel="noopener" class="kc-tag kc-tag-blue" x-text="sel"></a>
            <strong x-text="current(matrix).name"></strong>
            <span class="text-muted small" x-text="(current(matrix).tactics || []).join(', ')"></span>
            <span class="kc-tag" x-text="current(matrix).count + ' tagged rules'"></span>
            <button class="btn btn-sm btn-outline-secondary ms-auto" @click="sel = null">✕</button>
          </div>
          <div class="small text-muted mb-1">Modules referencing this technique (click to open the rule editor):</div>
          <ul class="list-unstyled mb-0 vsm-overlay-list"><template x-for="m in current(matrix).modules" :key="m"><li><a :href="'#/m/' + m + '/edit'"><code x-text="m"></code></a></li></template></ul>
        </div>
      </template>
    </div>
  </div>
</template>
</body>
</html>
