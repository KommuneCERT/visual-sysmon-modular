{% extends "layout.html" %}
{% block content %}
<span class="kc-section-tag">{{ category.label }}</span>
<h1 class="kc-section-title">New module</h1>
<div class="kc-surface p-4 rounded-3 vsm-narrow">
  <form method="post" class="row g-3">
    <div class="col-12"><label class="form-label">Name (becomes the file name)</label><input class="form-control" name="name" placeholder="e.g. Our EDR exclusions" required>
      <div class="form-text">Saved as <code>{{ category.dirname }}/include_&lt;name&gt;.xml</code> in the overlay – upstream is never touched.</div></div>
    <div class="col-md-6"><label class="form-label">Type</label>
      <select class="form-select" name="kind"><option value="include">include – log when the rule matches</option><option value="exclude">exclude – suppress when the rule matches</option></select></div>
    <div class="col-md-6"><label class="form-label">Event type</label>
      <select class="form-select" name="event_type">{% for et in event_types %}<option value="{{ et }}" {% if et == default_event %}selected{% endif %}>{{ et }} ({{ schema.events[et].event_id }})</option>{% endfor %}</select></div>
    <div class="col-12 d-flex gap-2"><button class="btn btn-primary">Create and edit</button><a class="btn btn-outline-secondary" href="/p/{{ profile.slug }}/c/{{ category.dirname }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
