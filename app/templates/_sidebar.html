<div class="vsm-sidebar-head">
  <span class="kc-section-tag">Kategorier</span>
  <span class="kc-tag">{{ selected_total }} / {{ module_total }} valgt</span>
</div>
<div class="list-group list-group-flush vsm-catlist">
  {% for row in sidebar %}
  <a href="/p/{{ profile.slug }}/c/{{ row.cat.dirname }}"
     class="list-group-item list-group-item-action d-flex justify-content-between align-items-center {% if row.cat.dirname == active_category %}active{% endif %}">
    <span class="d-flex align-items-center gap-2 text-truncate">
      <span class="vsm-evid">{{ row.cat.event_ids|join('/') }}</span>
      <span class="text-truncate">{{ row.cat.label }}</span>
    </span>
    <span class="badge rounded-pill {% if row.selected == 0 %}vsm-badge-none{% elif row.selected == row.total %}vsm-badge-all{% else %}vsm-badge-some{% endif %}">{{ row.selected }}/{{ row.total }}</span>
  </a>
  {% endfor %}
</div>
